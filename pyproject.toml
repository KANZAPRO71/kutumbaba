[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-ai"
version = "0.1.0"
description = "Papua AI — modular voice-first companion runtime (local Python backend + web UI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Papua AI" }]
dependencies = [
    "pydantic>=2.12,<3",
    "typing-extensions>=4.6",
    "tzdata>=2024.1; platform_system=='Windows'",
]

[project.optional-dependencies]
web = [
    "uvicorn>=0.30,<1",
    "starlette>=0.45,<1",
    "fastapi>=0.115,<1",
    "anyio>=4.8,<5",
    "httpx>=0.28,<1",
    "websockets>=13,<17",
    "python-dotenv>=1.0",
    "google-genai>=2.20,<3",
    "python-multipart>=0.0.7",
    "annotated-types>=0.6",
]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/KANZAPRO71/kutumbaba"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"persona_ai.presets" = ["*.json"]
"persona_ai.personality.data" = ["*.json"]
"persona_ai.web" = ["static/**/*", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
markers = [
    "packaging: wheel install smoke (slow)",
    "live_gemini: calls real Gemini API",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
